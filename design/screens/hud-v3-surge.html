<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HUD — V3 Surge</title>
  <meta name="frame" content="1440x810">
  <link rel="stylesheet" href="../system/tokens.css">
  <link rel="stylesheet" href="../system/base.css">
  <link rel="stylesheet" href="../system/components.css">
  <style>
    /* ---------- shared scene ---------- */
    .arena { position: absolute; inset: 0; background: url("../assets/stone-chamber.png") center / cover; }
    .arena::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55)); }
    .field { position: absolute; left: 50%; display: flex; gap: var(--space-4); transform: translateX(-50%); }
    .field .c-mtg { --w: 96px; }
    .field--lands .c-mtg { --w: 62px; }
    .field--opp-lands { top: 128px; gap: var(--space-7); }
    .field--opp { top: 218px; }
    .field--me { top: 452px; }
    .field--me-lands { top: 598px; gap: var(--space-7); }
    .stackpile { position: relative; }
    .stackpile .c-count { position: absolute; top: -8px; right: -10px; }
    .hand { position: absolute; left: 50%; bottom: -96px; display: flex; transform: translateX(-50%); }
    .hand .c-mtg { --w: 132px; margin-left: -30px; }
    .hand .c-mtg:nth-child(1) { transform: rotate(-7deg) translateY(10px); }
    .hand .c-mtg:nth-child(3) { transform: rotate(7deg) translateY(10px); }
    .icons { position: absolute; width: 0; height: 0; }
    .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Surge HUD ---------- */
    /* V3 Surge: the bold one. Your deck's mana is the interface: the main action is a charged
       orb in your colours, the phase track is the ring around it, life totals are cut gems.
       Heavy grotesk type, big tap targets, saturated light: closer to a modern card game
       than to a 2012 fantasy MMO. */
    .hud { font-family: var(--font-surge); color: var(--color-surge-white); }

    .chip {
      display: inline-flex; align-items: center; gap: var(--space-2);
      height: 46px; padding: 0 var(--space-5);
      border: 0; border-radius: var(--radius-full);
      background: var(--color-panel);
      box-shadow: inset 0 0 0 2px rgba(255, 246, 216, 0.14), var(--shadow-plate);
      font-family: var(--font-surge); font-size: var(--text-md); font-weight: 700;
      color: var(--color-surge-white);
    }
    .chip--round { width: 46px; padding: 0; justify-content: center; }
    .chip .ico { width: 18px; height: 18px; stroke-width: 2; }

    /* The orb and its phase ring */
    .core { position: absolute; right: 28px; bottom: 24px; width: 200px; height: 200px; }
    .core::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: radial-gradient(circle, var(--color-panel) 62%, transparent 72%); }
    .ring { position: absolute; inset: 0; width: 200px; height: 200px; rotate: -90deg; overflow: visible; }
    .ring circle { fill: none; stroke-width: 9; }
    .ring .seg { stroke: rgba(255, 246, 216, 0.34); }
    .ring .seg.is-done { stroke: var(--color-surge-lo); }
    .ring .seg.is-on { stroke: var(--color-surge); stroke-width: 13; filter: drop-shadow(0 0 8px rgba(67, 224, 140, 0.9)); }
    .orb {
      position: absolute; inset: 26px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 0; border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.85), transparent 22%),
        radial-gradient(circle at 50% 60%, var(--color-surge), var(--color-surge-lo) 62%, var(--color-surge-deep));
      box-shadow: var(--glow-surge), inset 0 -10px 24px rgba(4, 38, 26, 0.6);
      font-family: var(--font-surge);
      color: var(--color-surge-deep);
    }
    .orb__label { font-size: 30px; font-weight: 800; line-height: 0.9; letter-spacing: -0.03em; }
    .orb__key { margin-top: var(--space-2); padding: 1px 8px; border-radius: var(--radius-full); background: rgba(4, 38, 26, 0.22); font-size: var(--text-xs); font-weight: 700; }
    .core__phase { position: absolute; right: 236px; bottom: 112px; text-align: right; white-space: nowrap; text-shadow: var(--shadow-text); }
    .core__phase strong { display: block; font-size: var(--text-3xl); font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
    .core__phase span { font-size: var(--text-sm); font-weight: 500; color: rgba(255, 246, 216, 0.75); }
    .core__phase em { font-style: normal; color: var(--color-surge); }
    .core__actions { position: absolute; right: 236px; bottom: 44px; display: flex; gap: var(--space-2); }

    /* Seats: portrait with a mana ring, life as a cut gem */
    .seat { position: absolute; display: flex; align-items: center; }
    .seat__face { width: 76px; height: 76px; border-radius: 50%; background: center / cover; }
    .seat__gem {
      display: grid; place-items: center;
      width: 64px; height: 56px; margin-left: -14px;
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      background: linear-gradient(180deg, var(--color-surge-white), #d9cfb2);
      color: var(--color-ink); font-size: 30px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
    }
    .seat__meta { margin-left: var(--space-3); text-shadow: var(--shadow-text); }
    .seat__name { font-size: var(--text-xl); font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
    .seat__zones { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
    .seat__zones span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: var(--radius-full); background: var(--color-panel); font-size: var(--text-sm); font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: none; }
    .seat__zones .ico { width: 13px; height: 13px; stroke-width: 2; opacity: 0.7; }
    .seat--opp { top: 18px; left: 50%; translate: -50% 0; }
    .seat--opp .seat__face { box-shadow: 0 0 0 4px var(--color-ink), 0 0 0 7px var(--mana-R), var(--shadow-plate); }
    .seat--me { left: 28px; bottom: 26px; }
    .seat--me .seat__face { box-shadow: 0 0 0 4px var(--color-ink), 0 0 0 7px var(--color-surge), 0 0 30px rgba(67, 224, 140, 0.55); }

    /* Log: toast chips with a card-art coin */
    .log { position: absolute; left: 28px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); }
    .log li { display: flex; align-items: center; gap: var(--space-2); max-width: 300px; padding: 4px 14px 4px 4px; border-radius: var(--radius-full); background: var(--color-panel); font-size: var(--text-sm); font-weight: 500; line-height: 1.2; opacity: 0.62; }
    .log li i { flex: none; width: 30px; height: 30px; border-radius: 50%; background: center 22% / 230% no-repeat; box-shadow: 0 0 0 2px var(--c, var(--mana-R)); }
    .log li b { font-weight: 800; }
    .log li.is-new { opacity: 1; box-shadow: inset 0 0 0 2px rgba(67, 224, 140, 0.5); }

    .menu { position: absolute; top: 20px; right: 24px; display: flex; gap: var(--space-2); }
  </style>
</head>
<body>
<div class="frame" data-name="Table">
  <svg class="icons" aria-hidden="true">
    <symbol id="i-library" viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="9" height="11" rx="1.2"/><path d="M5.5 1h7a1.5 1.5 0 0 1 1.5 1.5V12"/></symbol>
    <symbol id="i-hand" viewBox="0 0 16 16"><rect x="2" y="4" width="6" height="9" rx="1" transform="rotate(-12 5 8.5)"/><rect x="8" y="3" width="6" height="9" rx="1" transform="rotate(10 11 7.5)"/></symbol>
    <symbol id="i-grave" viewBox="0 0 16 16"><path d="M4 14V6.5a4 4 0 0 1 8 0V14"/><path d="M2.5 14h11M8 6v4M6.5 7.5h3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></symbol>
    <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 16 16"><path d="M6 12.5h4M6.5 14.5h3M8 1.5a4.5 4.5 0 0 0-2.6 8.2c.4.3.6.8.6 1.3V11h4v-.0c0-.5.2-1 .6-1.3A4.5 4.5 0 0 0 8 1.5z"/></symbol>
    <symbol id="i-sword" viewBox="0 0 16 16"><path d="M13.5 2.5 6 10M13.5 2.5H10.5M13.5 2.5V5.5M4 8.5l3.5 3.5M5.5 10.5 2.5 13.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></symbol>
  </svg>

  <div class="arena" data-name="Arena"></div>

  <section class="field field--lands field--opp-lands" data-name="Opponent Lands">
    <div class="stackpile"><div class="c-mtg c-mtg--tapped" data-component="MTG Card"><img src="../assets/mountain.jpg" alt=""></div><span class="c-count" data-component="Count">3</span></div>
    <div class="stackpile"><div class="c-mtg" data-component="MTG Card"><img src="../assets/mountain.jpg" alt=""></div><span class="c-count" data-component="Count">2</span></div>
  </section>
  <section class="field field--opp" data-name="Opponent Creatures">
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/heartfire-immolator.jpg" alt=""><span class="c-pt" data-component="PT">2/2</span></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/fanatical-firebrand.jpg" alt=""><span class="c-pt" data-component="PT">1/1</span></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/brazen-scourge.jpg" alt=""><span class="c-pt" data-component="PT">3/3</span></div>
  </section>
  <section class="field field--me" data-name="My Creatures">
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/gnarlback-rhino.jpg" alt=""><span class="c-pt" data-component="PT">4/4</span></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/druid-of-the-cowl.jpg" alt=""><span class="c-pt" data-component="PT">1/3</span></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/thornweald-archer.jpg" alt=""><span class="c-pt" data-component="PT">2/1</span></div>
  </section>
  <section class="field field--lands field--me-lands" data-name="My Lands">
    <div class="stackpile"><div class="c-mtg" data-component="MTG Card"><img src="../assets/forest.jpg" alt=""></div><span class="c-count" data-component="Count">4</span></div>
  </section>
  <section class="hand" data-name="Hand">
    <div class="c-mtg c-mtg--playable" data-component="MTG Card"><img src="../assets/giant-growth.jpg" alt=""></div>
    <div class="c-mtg c-mtg--playable" data-component="MTG Card"><img src="../assets/magnigoth-sentry.jpg" alt=""></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/overrun.jpg" alt=""></div>
  </section>

  <div class="hud" data-name="HUD">
    <div class="seat seat--opp" data-name="Opponent Badge">
      <div class="seat__face" style="background-image: url('../assets/deck-elenda.jpg')"></div>
      <div class="seat__gem">21</div>
      <div class="seat__meta">
        <div class="seat__name">Opponent</div>
        <div class="seat__zones"><span><svg class="ico"><use href="#i-library"/></svg>48</span><span><svg class="ico"><use href="#i-hand"/></svg>3</span><span><svg class="ico"><use href="#i-grave"/></svg>2</span></div>
      </div>
    </div>

    <ol class="log" data-name="Game Log">
      <li><i style="background-image: url('../assets/fanatical-firebrand.jpg')"></i><span>Opponent attacks with <b>Fanatical Firebrand</b></span></li>
      <li><i style="background-image: url('../assets/druid-of-the-cowl.jpg'); --c: var(--mana-G)"></i><span>You block with <b>Druid of the Cowl</b></span></li>
      <li class="is-new"><i style="background-image: url('../assets/thornweald-archer.jpg'); --c: var(--mana-G)"></i><span>You cast <b>Thornweald Archer</b></span></li>
    </ol>

    <div class="menu" data-name="Top Menu">
      <button class="chip chip--round" aria-label="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>
      <button class="chip chip--round" aria-label="Settings"><svg class="ico"><use href="#i-gear"/></svg></button>
    </div>

    <div class="seat seat--me" data-name="My Badge">
      <div class="seat__face" style="background-image: url('../assets/deck-arahbo.jpg')"></div>
      <div class="seat__gem">19</div>
      <div class="seat__meta">
        <div class="seat__name">You</div>
        <div class="seat__zones"><span><svg class="ico"><use href="#i-library"/></svg>29</span><span><svg class="ico"><use href="#i-hand"/></svg>3</span><span><svg class="ico"><use href="#i-grave"/></svg>4</span></div>
      </div>
    </div>

    <div class="core__phase" data-name="Turn Label"><strong>Main phase</strong><span>Your turn · <em>Turn 12</em></span></div>
    <div class="core__actions" data-name="Turn Actions">
      <button class="chip chip--round" aria-label="Hint" data-name="Hint"><svg class="ico"><use href="#i-bulb"/></svg></button>
      <button class="chip" data-name="End Turn">End turn</button>
    </div>
    <div class="core" data-name="Turn Controls">
      <!-- Six phase segments; r=90 gives a circumference of 565.5, so 84.8 dash + 9.4 gap each. -->
      <svg class="ring" viewBox="0 0 200 200" data-name="Phase Track">
        <circle class="seg is-done" cx="100" cy="100" r="90" stroke-dasharray="84.8 480.7" stroke-dashoffset="-4.7"/>
        <circle class="seg is-done" cx="100" cy="100" r="90" stroke-dasharray="84.8 480.7" stroke-dashoffset="-98.9"/>
        <circle class="seg is-on" cx="100" cy="100" r="90" stroke-dasharray="84.8 480.7" stroke-dashoffset="-193.1"/>
        <circle class="seg" cx="100" cy="100" r="90" stroke-dasharray="84.8 480.7" stroke-dashoffset="-287.4"/>
        <circle class="seg" cx="100" cy="100" r="90" stroke-dasharray="84.8 480.7" stroke-dashoffset="-381.6"/>
        <circle class="seg" cx="100" cy="100" r="90" stroke-dasharray="84.8 480.7" stroke-dashoffset="-475.9"/>
      </svg>
      <button class="orb" data-name="Primary Action"><span class="orb__label">To<br>combat</span><span class="orb__key">Space</span></button>
    </div>
  </div>
</div>
</body>
</html>
