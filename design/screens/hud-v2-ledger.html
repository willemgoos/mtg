<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HUD — V2 Ledger</title>
  <meta name="frame" content="1440x810">
  <link rel="stylesheet" href="../system/tokens.css">
  <link rel="stylesheet" href="../system/base.css">
  <link rel="stylesheet" href="../system/components.css">
  <style>
    /* ---------- shared scene ---------- */
    .arena { position: absolute; inset: 0; background: url("../assets/stone-chamber.png") center / cover; }
    .arena::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55)); }
    .field { position: absolute; left: 50%; display: flex; gap: var(--space-4); transform: translateX(-50%); }
    .field .c-mtg { --w: 96px; }
    .field--lands .c-mtg { --w: 62px; }
    .field--opp-lands { top: 128px; gap: var(--space-7); }
    .field--opp { top: 218px; }
    .field--me { top: 452px; }
    .field--me-lands { top: 598px; gap: var(--space-7); }
    .stackpile { position: relative; }
    .stackpile .c-count { position: absolute; top: -8px; right: -10px; }
    .hand { position: absolute; left: 50%; bottom: -96px; display: flex; transform: translateX(-50%); }
    .hand .c-mtg { --w: 132px; margin-left: -30px; }
    .hand .c-mtg:nth-child(1) { transform: rotate(-7deg) translateY(10px); }
    .hand .c-mtg:nth-child(3) { transform: rotate(7deg) translateY(10px); }
    .icons { position: absolute; width: 0; height: 0; }
    .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Ledger HUD ---------- */
    /* V2 Ledger: flat, editorial, luxe. Black lacquer and hairline gilt rules, a big italic
       serif for what you read at a glance (life, phase), a tight grotesk for everything you
       act on. No bevels, no gloss, no rounded pills. */
    .hud { font-family: var(--font-ledger-ui); color: var(--color-parchment); }

    .btn {
      display: inline-flex; align-items: center; gap: var(--space-3);
      height: 52px; padding: 0 var(--space-5);
      border: 1px solid var(--color-hairline); border-radius: 0;
      background: var(--color-lacquer);
      font-family: var(--font-ledger-ui); font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-parchment);
    }
    .btn--primary {
      height: 60px; padding: 0 0 0 var(--space-6);
      border-color: var(--color-parchment);
      background: var(--color-parchment);
      color: var(--color-ink); font-size: var(--text-md); font-weight: 700;
      box-shadow: var(--shadow-plate);
    }
    .btn__go { display: grid; place-items: center; align-self: stretch; width: 60px; margin-left: var(--space-5); background: var(--color-ink); color: var(--color-gilt); }
    .btn__go .ico { width: 22px; height: 22px; stroke-width: 1.8; }
    .btn--sq { width: 44px; height: 44px; padding: 0; justify-content: center; }
    .btn--sq .ico { width: 18px; height: 18px; }

    .turn { position: absolute; right: 32px; bottom: 28px; width: 430px; display: flex; flex-direction: column; gap: var(--space-4); }
    .turn__head { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: var(--space-2); border-bottom: 1px solid var(--color-hairline); }
    .turn__who { font-family: var(--font-ledger-display); font-style: italic; font-size: var(--text-4xl); line-height: 1; color: var(--color-text-strong); text-shadow: var(--shadow-text); }
    .turn__num { font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-gilt); font-variant-numeric: tabular-nums; }
    .phases { display: grid; grid-template-columns: repeat(6, 1fr); font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .phase { padding-top: var(--space-2); border-top: 2px solid rgba(239, 229, 207, 0.18); color: var(--color-text-muted); text-shadow: var(--shadow-text); }
    .phase.is-done { border-top-color: rgba(226, 184, 92, 0.55); color: var(--color-text); }
    .phase.is-on { border-top: 4px solid var(--color-gilt); padding-top: calc(var(--space-2) - 2px); color: var(--color-gilt); }
    .turn__actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

    /* Life: a numeral on the table, not in a box */
    .seat { position: absolute; display: flex; align-items: flex-end; gap: var(--space-4); text-shadow: var(--shadow-text); }
    .seat__face { width: 56px; height: 70px; background: center / cover; outline: 1px solid var(--color-gilt); outline-offset: 3px; box-shadow: var(--shadow-plate); }
    .seat__life { font-family: var(--font-ledger-display); font-size: 84px; line-height: 0.8; letter-spacing: -0.03em; color: var(--color-text-strong); font-variant-numeric: tabular-nums; }
    .seat__meta { padding-bottom: 2px; }
    .seat__name { font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-gilt); }
    .seat__zones { display: flex; gap: var(--space-3); margin-top: var(--space-1); font-size: var(--text-sm); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--color-text); }
    .seat__zones span { display: inline-flex; align-items: center; gap: 4px; }
    .seat__zones .ico { width: 13px; height: 13px; color: var(--color-text-muted); }
    .seat--active .seat__face { outline: 2px solid var(--color-parchment); }
    .seat--opp { top: 22px; left: 50%; translate: -50% 0; }
    .seat--me { left: 32px; bottom: 28px; }

    .log { position: absolute; left: 32px; top: 50%; translate: 0 -50%; width: 270px; border-top: 1px solid var(--color-hairline); }
    .log li { display: grid; grid-template-columns: 32px 1fr; padding: var(--space-2) 0; border-bottom: 1px solid var(--color-hairline); font-size: var(--text-sm); line-height: var(--leading-snug); color: var(--color-text); text-shadow: var(--shadow-text); }
    .log small { padding-top: 3px; font-size: var(--text-2xs); font-weight: 700; letter-spacing: 0.06em; color: var(--color-text-muted); }
    .log b { font-family: var(--font-ledger-display); font-style: italic; font-weight: 400; font-size: var(--text-md); color: var(--color-text-strong); }
    .log li.is-new small { color: var(--color-gilt); }

    .menu { position: absolute; top: 22px; right: 24px; display: flex; gap: var(--space-2); }
  </style>
</head>
<body>
<div class="frame" data-name="Table">
  <svg class="icons" aria-hidden="true">
    <symbol id="i-library" viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="9" height="11" rx="1.2"/><path d="M5.5 1h7a1.5 1.5 0 0 1 1.5 1.5V12"/></symbol>
    <symbol id="i-hand" viewBox="0 0 16 16"><rect x="2" y="4" width="6" height="9" rx="1" transform="rotate(-12 5 8.5)"/><rect x="8" y="3" width="6" height="9" rx="1" transform="rotate(10 11 7.5)"/></symbol>
    <symbol id="i-grave" viewBox="0 0 16 16"><path d="M4 14V6.5a4 4 0 0 1 8 0V14"/><path d="M2.5 14h11M8 6v4M6.5 7.5h3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></symbol>
    <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 16 16"><path d="M6 12.5h4M6.5 14.5h3M8 1.5a4.5 4.5 0 0 0-2.6 8.2c.4.3.6.8.6 1.3V11h4v-.0c0-.5.2-1 .6-1.3A4.5 4.5 0 0 0 8 1.5z"/></symbol>
    <symbol id="i-sword" viewBox="0 0 16 16"><path d="M13.5 2.5 6 10M13.5 2.5H10.5M13.5 2.5V5.5M4 8.5l3.5 3.5M5.5 10.5 2.5 13.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></symbol>
  </svg>

  <div class="arena" data-name="Arena"></div>

  <section class="field field--lands field--opp-lands" data-name="Opponent Lands">
    <div class="stackpile"><div class="c-mtg c-mtg--tapped" data-component="MTG Card"><img src="../assets/mountain.jpg" alt=""></div><span class="c-count" data-component="Count">3</span></div>
    <div class="stackpile"><div class="c-mtg" data-component="MTG Card"><img src="../assets/mountain.jpg" alt=""></div><span class="c-count" data-component="Count">2</span></div>
  </section>
  <section class="field field--opp" data-name="Opponent Creatures">
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/heartfire-immolator.jpg" alt=""><span class="c-pt" data-component="PT">2/2</span></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/fanatical-firebrand.jpg" alt=""><span class="c-pt" data-component="PT">1/1</span></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/brazen-scourge.jpg" alt=""><span class="c-pt" data-component="PT">3/3</span></div>
  </section>
  <section class="field field--me" data-name="My Creatures">
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/gnarlback-rhino.jpg" alt=""><span class="c-pt" data-component="PT">4/4</span></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/druid-of-the-cowl.jpg" alt=""><span class="c-pt" data-component="PT">1/3</span></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/thornweald-archer.jpg" alt=""><span class="c-pt" data-component="PT">2/1</span></div>
  </section>
  <section class="field field--lands field--me-lands" data-name="My Lands">
    <div class="stackpile"><div class="c-mtg" data-component="MTG Card"><img src="../assets/forest.jpg" alt=""></div><span class="c-count" data-component="Count">4</span></div>
  </section>
  <section class="hand" data-name="Hand">
    <div class="c-mtg c-mtg--playable" data-component="MTG Card"><img src="../assets/giant-growth.jpg" alt=""></div>
    <div class="c-mtg c-mtg--playable" data-component="MTG Card"><img src="../assets/magnigoth-sentry.jpg" alt=""></div>
    <div class="c-mtg" data-component="MTG Card"><img src="../assets/overrun.jpg" alt=""></div>
  </section>

  <div class="hud" data-name="HUD">
    <div class="seat seat--opp" data-name="Opponent Badge">
      <div class="seat__face" style="background-image: url('../assets/deck-elenda.jpg')"></div>
      <div class="seat__life">21</div>
      <div class="seat__meta">
        <div class="seat__name">Opponent</div>
        <div class="seat__zones"><span><svg class="ico"><use href="#i-library"/></svg>48</span><span><svg class="ico"><use href="#i-hand"/></svg>3</span><span><svg class="ico"><use href="#i-grave"/></svg>2</span></div>
      </div>
    </div>

    <ol class="log" data-name="Game Log">
      <li><small>T11</small><span>Opponent attacks with <b>Fanatical Firebrand</b></span></li>
      <li><small>T11</small><span>You block with <b>Druid of the Cowl</b></span></li>
      <li class="is-new"><small>T12</small><span>You cast <b>Thornweald Archer</b></span></li>
    </ol>

    <div class="menu" data-name="Top Menu">
      <button class="btn btn--sq" aria-label="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>
      <button class="btn btn--sq" aria-label="Settings"><svg class="ico"><use href="#i-gear"/></svg></button>
    </div>

    <div class="seat seat--me seat--active" data-name="My Badge">
      <div class="seat__face" style="background-image: url('../assets/deck-arahbo.jpg')"></div>
      <div class="seat__life">19</div>
      <div class="seat__meta">
        <div class="seat__name">You</div>
        <div class="seat__zones"><span><svg class="ico"><use href="#i-library"/></svg>29</span><span><svg class="ico"><use href="#i-hand"/></svg>3</span><span><svg class="ico"><use href="#i-grave"/></svg>4</span></div>
      </div>
    </div>

    <div class="turn" data-name="Turn Controls">
      <div class="turn__head" data-name="Turn Label"><span class="turn__who">Your main phase</span><span class="turn__num">Turn 12</span></div>
      <ol class="phases" data-name="Phase Track">
        <li class="phase is-done">Upkeep</li><li class="phase is-done">Draw</li><li class="phase is-on">Main</li><li class="phase">Combat</li><li class="phase">Main</li><li class="phase">End</li>
      </ol>
      <div class="turn__actions">
        <button class="btn btn--sq" aria-label="Hint" data-name="Hint"><svg class="ico"><use href="#i-bulb"/></svg></button>
        <button class="btn" data-name="End Turn">End turn</button>
        <button class="btn btn--primary" data-name="Primary Action">To combat<span class="btn__go"><svg class="ico"><use href="#i-arrow"/></svg></span></button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
